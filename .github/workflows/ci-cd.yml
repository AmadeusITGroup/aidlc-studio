name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

# Security: least-privilege default. Jobs opt into more where needed.
permissions:
  contents: read

# Cancel superseded pull-request runs; keep every branch/main run distinct.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'

jobs:
  # Supply-chain / vulnerability scanning. Non-gating for the build but
  # surfaces results in the repo's Security tab.
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # upload-sarif queries the workflow-run API for telemetry/fingerprints.
      actions: read
      # Read-only here; the PR comment is posted by post-pr-comment.yml.
      pull-requests: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Report pre-existing vulnerabilities on PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/npm-audit-pr-comment
        with:
          working-directory: ${{ github.workspace }}
          audit-flags: --omit=dev
          min-severity: moderate
          label: extension

      - name: Run Trivy filesystem scan
        id: trivy_scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          skip-dirs: 'node_modules,out'

      # Upload to the code-scanning dashboard. Skipped on fork PRs (read-only
      # token). Non-fatal: if Code Scanning / Advanced Security isn't enabled on
      # the repo the upload is rejected, but Trivy already ran and its findings
      # are in the job log, so CI stays green. Enabling the feature later makes
      # this populate the Security tab with no workflow change.
      - name: Upload Trivy results to Security tab
        if: >
          steps.trivy_scan.outcome == 'success'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # Cross-platform build/lint/type-check/test. The extension shells out and has
  # per-OS code paths (process.platform), so validate on all three.
  validate:
    name: Build, Lint & Test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm run test

  # Package the VSIX once (on Linux) and decide whether a release is due.
  package:
    name: Package VSIX
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_changed: ${{ steps.check_tag.outputs.version_changed }}
      minor_or_major_changed: ${{ steps.check_tag.outputs.minor_or_major_changed }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      # Only tags are needed (version-exists check + X.Y gate), not full history.
      # Shallow + tags is lighter and less prone to transient deep-fetch failures.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check version against existing tags
        id: check_tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CUR_MAJOR="${VERSION%%.*}"
          CUR_MINOR="$(echo "$VERSION" | cut -d. -f2)"

          # Query tags from the REMOTE (authoritative, independent of the local
          # fetch depth). A shallow checkout can hide existing tags from
          # git rev-parse / git tag -l, which previously made the version-exists
          # check miss a tag that already existed on GitHub and let the release
          # job try to recreate it (HTTP 422 already_exists). ls-remote avoids that.
          ALL_TAGS="$(git ls-remote --tags origin 'v[0-9]*.[0-9]*.[0-9]*' \
            | sed -E 's#.*refs/tags/##; s#\^\{\}$##' \
            | sort -u)"

          # (1) version_changed: does a vX.Y.Z tag for THIS version already exist?
          #     Drives the GitHub Release (fires on ANY version bump, incl. patch).
          if echo "$ALL_TAGS" | grep -qx "v${VERSION}"; then
            echo "Tag v${VERSION} already exists on remote — no release"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v${VERSION} does not exist — will create release"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

          # (2) minor_or_major_changed: did X or Y change vs the latest released
          #     version? Drives Marketplace + Open VSX publishing (patch-only
          #     bumps publish to GitHub Release only, not the marketplaces).
          #     Previous = highest existing vX.Y.Z tag other than this version.
          PREV="$(echo "$ALL_TAGS" | sed 's/^v//' | grep -vx "${VERSION}" | sort -V | tail -n1)"
          if [ -z "$PREV" ]; then
            echo "No prior version tag — first release counts as minor/major"
            echo "minor_or_major_changed=true" >> "$GITHUB_OUTPUT"
          else
            PREV_MAJOR="${PREV%%.*}"
            PREV_MINOR="$(echo "$PREV" | cut -d. -f2)"
            if [ "$CUR_MAJOR" != "$PREV_MAJOR" ] || [ "$CUR_MINOR" != "$PREV_MINOR" ]; then
              echo "Minor/major changed ($PREV -> $VERSION) — marketplaces will publish"
              echo "minor_or_major_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Patch-only change ($PREV -> $VERSION) — GitHub Release only"
              echo "minor_or_major_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: |
          echo "y" | npx @vscode/vsce package --no-dependencies --allow-missing-repository

      - name: Generate checksum
        run: sha256sum *.vsix > checksums.txt

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: aidlc-studio-${{ steps.version.outputs.version }}-vsix
          path: |
            *.vsix
            checksums.txt
          retention-days: 30

  release:
    name: Create Release
    needs: package
    if: >
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.package.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: aidlc-studio-${{ needs.package.outputs.version }}-vsix

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.package.outputs.version }}
          name: AIDLC Studio v${{ needs.package.outputs.version }}
          body: |
            ## AIDLC Studio v${{ needs.package.outputs.version }}

            ### Installation
            Download the `.vsix` file below and install:

            1. In Kiro IDE or VS Code: `Ctrl+Shift+P` → `Extensions: Install from VSIX...` → select the file
            2. Or from terminal: `code --install-extension aidlc-studio-${{ needs.package.outputs.version }}.vsix`

            ### Integrity
            Verify the download against `checksums.txt`:
            ```
            sha256sum -c checksums.txt
            ```

            > The Source code archives are auto-generated by GitHub and not needed for installation.
          artifacts: '*.vsix,checksums.txt'
          draft: false
          prerelease: false
          # Belt-and-suspenders: the job is already gated on version_changed, but
          # if a release for this tag somehow exists, no-op instead of erroring 422.
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}
