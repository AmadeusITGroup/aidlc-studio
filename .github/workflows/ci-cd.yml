name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_changed: ${{ steps.check_tag.outputs.version_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check if version tag already exists
        id: check_tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists — skipping release"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v${VERSION} does not exist — will create release"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm run test

      - name: Package VSIX
        run: |
          echo "y" | npx @vscode/vsce package --no-dependencies --allow-missing-repository

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: aidlc-studio-${{ steps.version.outputs.version }}-vsix
          path: '*.vsix'
          retention-days: 30

  release:
    name: Create Release
    needs: ci
    if: >
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.ci.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: aidlc-studio-${{ needs.ci.outputs.version }}-vsix

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.ci.outputs.version }}
          name: AIDLC Studio v${{ needs.ci.outputs.version }}
          body: |
            ## AIDLC Studio v${{ needs.ci.outputs.version }}

            ### Installation
            Download the `.vsix` file below and install:

            1. In Kiro IDE: `Ctrl+Shift+P` → `Extensions: Install from VSIX...` → select the file
            2. Or from terminal: `code --install-extension aidlc-studio-${{ needs.ci.outputs.version }}.vsix`

            > The Source code archives are auto-generated by GitHub and not needed for installation.
          artifacts: '*.vsix'
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
