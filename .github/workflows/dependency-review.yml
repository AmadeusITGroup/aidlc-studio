name: Dependency Review

# Gate on newly-introduced vulnerabilities. dependency-review-action diffs the
# PR's dependency graph (base -> head), so it only flags dependencies CHANGED by
# this PR. Pre-existing issues are surfaced (non-blocking) by the Trivy scan in
# the CI/CD workflow.
on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review (fail on new vulnerabilities)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
